<title>마이폴학교 시뮬레이터</title>
<!--
  마이폴학교 시뮬레이터 베타 — Babylon.js 판 (새로 만드는 중)
  엔진: Babylon.js 9.28 (Apache-2.0) · 글꼴: Bagel Fat One · IBM Plex Sans KR (Google Fonts, OFL)
  텍스처는 전부 코드로 만든 절차적 PBR 텍스처 · 세계는 복셀(블록) · 메시는 워커에서 생성
-->
<meta name="theme-color" content="#0b1120"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Black+Han+Sans&display=swap">
<style>
/* 레이아웃: 전체 화면 캔버스 위에 반투명 남색 판(HUD). 노랑 하나만 강조색. */
:root{--f-disp:"Bagel Fat One","IBM Plex Sans KR",system-ui,sans-serif;--f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
--panel:rgba(11,17,32,.78);--panel2:rgba(22,30,46,.9);--line:rgba(255,255,255,.12);--fg:#fff;--muted:rgba(255,255,255,.62);--acc:#f5c542;--bg:#0b1120;--r:12px;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);overflow:hidden;-webkit-text-size-adjust:100%}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--fg);padding:8px 12px;font-size:13px;line-height:1.35}
#hud{pointer-events:none}
#hud .panel{pointer-events:auto}
#title{left:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center}
#title b{font-family:var(--f-disp);font-weight:400;font-size:20px;letter-spacing:.5px;color:var(--acc);text-shadow:0 2px 0 rgba(0,0,0,.35)}
#title .beta{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:1px 6px}
#place{left:12px;top:calc(62px + env(safe-area-inset-top,0px));font-weight:600;font-size:14px}
#place small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:2px}
#stats{right:12px;top:calc(12px + env(safe-area-inset-top,0px));text-align:right;font-variant-numeric:tabular-nums}
#stats .t{font-family:var(--f-disp);font-size:22px;color:var(--fg);font-weight:400}
#stats .q{color:var(--muted);font-size:11px}
#tip{left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(92vw,560px);text-align:center;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hotbar{left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;padding:6px}
#hotbar .slot{width:44px;height:44px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid var(--line);display:grid;place-items:center;font-size:22px;position:relative}
#hotbar .slot.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(245,197,66,.45) inset}
#hotbar .slot i{position:absolute;left:4px;top:2px;font-size:9px;color:var(--muted);font-style:normal}
#cross{position:fixed;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);pointer-events:none;opacity:.8}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross:before{left:6px;top:0;width:2px;height:14px}#cross:after{top:6px;left:0;height:2px;width:14px}
button.btn{font:inherit;font-size:13px;font-weight:600;color:var(--fg);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
button.btn:hover{background:rgba(255,255,255,.14)}button.btn.acc{background:var(--acc);color:#1a1a1a;border-color:transparent}
button.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#menu{right:12px;top:calc(72px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;padding:8px}
#settings{right:12px;top:calc(72px + env(safe-area-inset-top,0px));width:min(92vw,320px);max-height:calc(100vh - 120px);overflow:auto;padding:12px 14px}
#settings h3{margin:0 0 8px;font-size:14px;font-family:var(--f-disp);font-weight:400;color:var(--acc)}
#settings .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
#settings .row:first-of-type{border-top:0}
#settings select,#settings input[type=range]{font:inherit;color:var(--fg);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
#settings input[type=range]{width:130px;padding:0}
#settings .help{color:var(--muted);font-size:12px;line-height:1.5;margin-top:8px}
#settings kbd{font:inherit;font-size:11px;background:rgba(255,255,255,.12);border-radius:5px;padding:1px 5px}
/* 휴대폰 조작 */
#touch{position:fixed;inset:0;pointer-events:none}
#stick{position:absolute;left:28px;bottom:calc(28px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(11,17,32,.45);border:1px solid var(--line);pointer-events:auto;touch-action:none}
#stick .knob{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.5)}
#tbtns{position:absolute;right:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,64px);gap:10px;pointer-events:auto}
#tbtns button{width:64px;height:64px;border-radius:50%;background:rgba(11,17,32,.6);border:1px solid var(--line);color:#fff;font:inherit;font-size:12px;font-weight:700;touch-action:none;-webkit-user-select:none;user-select:none}
#tbtns button.on{background:rgba(245,197,66,.85);color:#1a1a1a}
#look{position:absolute;right:0;top:0;width:55%;height:70%;pointer-events:auto;touch-action:none}
/* 로딩 */
#load{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 10%,#17345a 0%,#0b1120 60%,#070b14 100%);display:grid;place-items:center;z-index:10;color:#fff;text-align:center;padding:16px}
#load h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(34px,8vw,64px);margin:0 0 4px;color:var(--acc);text-shadow:0 4px 0 rgba(0,0,0,.35)}
#load p{margin:0;color:var(--muted);font-size:14px}
#load .bar{width:min(80vw,420px);height:10px;border-radius:6px;background:rgba(255,255,255,.1);margin:22px auto 10px;overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f5c542,#ffe08a);border-radius:6px;transition:width .25s}
#load .step{font-size:13px;color:#fff;min-height:1.4em}
#load .note{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.6}
#load button{margin-top:20px;font-size:17px;padding:12px 28px;border-radius:14px}
#load .sub{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
#load .sub button{font-size:13px;padding:7px 12px;margin:0}
[hidden]{display:none!important}
@media (max-width:640px){#tip{font-size:12px;bottom:calc(120px + env(safe-area-inset-bottom,0px))}#hotbar{bottom:calc(150px + env(safe-area-inset-bottom,0px));gap:4px}#hotbar .slot{width:36px;height:36px;font-size:18px}#settings{width:min(94vw,320px)}#title b{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<canvas id="game" tabindex="0"></canvas>
<div id="load">
  <div>
    <h1>마이폴학교</h1>
    <p>시뮬레이터 · Babylon.js 새 엔진</p>
    <div class="bar"><i id="loadBar"></i></div>
    <div class="step" id="loadStep">엔진 켜는 중</div>
    <div id="loadStart" hidden>
      <button class="btn acc" id="btnStart">▶ 시작</button>
      <div class="sub">
        <button class="btn" data-q="low">낮음</button><button class="btn" data-q="mid">중간</button><button class="btn" data-q="high">높음</button><button class="btn" data-q="ultra">최고</button>
      </div>
      <div class="note" id="loadNote"></div>
    </div>
  </div>
</div>
<div id="hud" hidden>
  <div class="panel" id="title"><b>마이폴학교</b><span class="beta">시뮬레이터 · Babylon</span></div>
  <div class="panel" id="place">학교 안<small id="placeSub"></small></div>
  <div class="panel" id="stats"><div class="t" id="clock">09:30</div><div class="q" id="fps"></div></div>
  <div class="panel" id="menu"><button class="btn" id="btnSettings">⚙ 설정</button><button class="btn" id="btnBuild">🧱 짓기</button><button class="btn" id="btnCar">🚗 차</button></div>
  <div class="panel" id="settings" hidden>
    <h3>설정</h3>
    <div class="row"><span>화질</span><select id="selQuality"><option value="low">낮음</option><option value="mid">중간</option><option value="high">높음</option><option value="ultra">최고</option></select></div>
    <div class="row"><span>해상도 자동</span><input type="checkbox" id="chkDyn" checked></div>
    <div class="row"><span>시간</span><input type="range" id="rngTime" min="0" max="24" step="0.05"></div>
    <div class="row"><span>시간 흐름</span><select id="selFlow"><option value="0">멈춤</option><option value="1" selected>보통(1분=1시간)</option><option value="4">빠름</option></select></div>
    <div class="row"><span>시야</span><input type="range" id="rngFov" min="50" max="100" step="1" value="72"></div>
    <div class="row"><span>성능 표시</span><input type="checkbox" id="chkStats" checked></div>
    <div class="help" id="helpText"><b>조작</b><br><kbd>W A S D</kbd> 이동 · <kbd>Shift</kbd> 달리기 · <kbd>Space</kbd> 점프 · 마우스 시점 · 휠 줌<br><kbd>E</kbd> 차 타기/내리기 · <kbd>X</kbd> 짓기 모드 · 좌클릭 캐기 · 우클릭 놓기 · <kbd>1~9</kbd> 블록 · <kbd>V</kbd> 반블록 모양<br><kbd>T</kbd> 시간 빨리 · <kbd>Esc</kbd> 마우스 풀기</div>
  </div>
  <div class="panel" id="tip" hidden></div>
  <div class="panel" id="hotbar" hidden></div>
  <div id="cross" hidden></div>
  <div id="touch" hidden><div id="look"></div><div id="stick"><div class="knob"></div></div><div id="tbtns"><button id="tJump">점프</button><button id="tRun">달리기</button><button id="tAct">E</button><button id="tBreak">캐기</button><button id="tPlace">놓기</button><button id="tBuild">짓기</button></div></div>
</div>
